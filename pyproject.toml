[project]
name = "vapourlint"
version = "0.0.2.dev0"
description = "A static analyzer for VapourSynth scripts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The VapourLint Authors" }]
requires-python = ">=3.12"
keywords = ["vapoursynth", "lint", "static-analysis", "video"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
vapourlint = "vapourlint.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
